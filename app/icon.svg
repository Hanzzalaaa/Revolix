<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="logoGradient2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle with glow -->
  <circle cx="100" cy="100" r="91" fill="url(#logoGradient1)" opacity="0.15" />

  <!-- Main R shape - stylized and modern -->
  <path
    d="M58 50h50c22.9 0 41.6 18.7 41.6 41.6s-18.7 41.6-41.6 41.6h-8.3l33.3 33.3"
    stroke="url(#logoGradient1)"
    stroke-width="14.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    filter="url(#glow)"
  />

  <!-- Vertical line of R -->
  <path
    d="M58 50v116.6"
    stroke="url(#logoGradient1)"
    stroke-width="14.5"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Accent dots - innovation nodes -->
  <circle cx="158" cy="158" r="12.5" fill="url(#logoGradient2)" />
  <circle cx="108" cy="91.6" r="8.3" fill="url(#logoGradient2)" opacity="0.7" />
  <circle cx="150" cy="66.6" r="10.4" fill="url(#logoGradient2)" />
</svg>
