<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#101B33"/>
    </linearGradient>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B2C4F"/>
      <stop offset="100%" stop-color="#14203B"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5A623"/>
      <stop offset="100%" stop-color="#E8871A"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- subtle grid dots texture -->
  <g opacity="0.08">
    <circle cx="60" cy="60" r="1.5" fill="#5EEAD4"/>
    <circle cx="120" cy="60" r="1.5" fill="#5EEAD4"/>
    <circle cx="180" cy="60" r="1.5" fill="#5EEAD4"/>
    <circle cx="60" cy="120" r="1.5" fill="#5EEAD4"/>
    <circle cx="120" cy="120" r="1.5" fill="#5EEAD4"/>
    <circle cx="180" cy="120" r="1.5" fill="#5EEAD4"/>
    <circle cx="60" cy="180" r="1.5" fill="#5EEAD4"/>
    <circle cx="120" cy="180" r="1.5" fill="#5EEAD4"/>
  </g>

  <!-- browser search bar mockup, grounding the subject -->
  <g transform="translate(72,64)">
    <rect x="0" y="0" width="430" height="46" rx="10" fill="#0F1B33" stroke="#2A3B5C" stroke-width="1.5"/>
    <circle cx="24" cy="23" r="5" fill="#EF6B6B"/>
    <circle cx="42" cy="23" r="5" fill="#F1C453"/>
    <circle cx="60" cy="23" r="5" fill="#5FD68E"/>
    <rect x="90" y="12" width="300" height="22" rx="6" fill="#182A4D"/>
    <text x="102" y="27" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#7C8CAE">yourbusiness.com</text>
  </g>

  <!-- Eyebrow label -->
  <text x="72" y="185" font-family="Helvetica, Arial, sans-serif" font-size="15" letter-spacing="3" fill="#5EEAD4" font-weight="700">REVOLIX TECH · SEO GUIDE</text>

  <!-- Headline -->
  <text x="70" y="255" font-family="Georgia, 'Times New Roman', serif" font-size="56" fill="#F4F7FB" font-weight="700">On-Page SEO</text>
  <text x="70" y="315" font-family="Georgia, 'Times New Roman', serif" font-size="56" fill="#F4F7FB" font-weight="700">Checklist <tspan fill="#F5A623">2026</tspan></text>

  <!-- Subheadline -->
  <text x="72" y="360" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#9FB0CC">15 steps to actually rank higher — not just theory.</text>

  <!-- footer wordmark -->
  <text x="72" y="580" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#5A6B8C" font-weight="600">revolixtech.com</text>
  <rect x="72" y="592" width="46" height="3" fill="#5EEAD4"/>

  <!-- Signature element: ranking staircase climbing to #1 -->
  <g transform="translate(700,120)">
    <!-- step 3 -->
    <rect x="260" y="330" width="130" height="70" rx="8" fill="url(#stepGrad)" stroke="#2A3B5C"/>
    <circle cx="292" cy="365" r="14" fill="none" stroke="#5EEAD4" stroke-width="2.5"/>
    <path d="M285 365 l5 6 l10 -12" stroke="#5EEAD4" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="318" y="371" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#C9D6EC" font-weight="600">Rank #8</text>

    <!-- step 2 -->
    <rect x="140" y="230" width="130" height="100" rx="8" fill="url(#stepGrad)" stroke="#2A3B5C"/>
    <circle cx="172" cy="280" r="14" fill="none" stroke="#5EEAD4" stroke-width="2.5"/>
    <path d="M165 280 l5 6 l10 -12" stroke="#5EEAD4" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="198" y="286" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#C9D6EC" font-weight="600">Rank #4</text>

    <!-- step 1 (top, badge) -->
    <rect x="20" y="90" width="130" height="140" rx="8" fill="url(#stepGrad)" stroke="#2A3B5C"/>
    <circle cx="85" cy="145" r="30" fill="url(#badgeGrad)"/>
    <text x="85" y="153" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1A1200" font-weight="800" text-anchor="middle">#1</text>
    <text x="85" y="205" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#F4F7FB" font-weight="700" text-anchor="middle">You, soon</text>

    <!-- ground line -->
    <line x1="10" y1="400" x2="400" y2="400" stroke="#243755" stroke-width="2"/>

    <!-- small upward arrow trail -->
    <path d="M410 380 C 350 320, 300 260, 200 190 S 90 90, 60 70" stroke="#5EEAD4" stroke-width="2" stroke-dasharray="5 6" fill="none" opacity="0.55"/>
    <path d="M60 70 l-10 14 l18 2 z" fill="#5EEAD4" opacity="0.55"/>
  </g>
</svg>
